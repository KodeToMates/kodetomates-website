<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1916"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="48" y1="48" x2="208" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF914D"/>
      <stop offset="100%" stop-color="#E4521B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF914D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E4521B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#AB003E" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="256" height="256" rx="128" fill="url(#bgGrad)"/>
  <circle cx="128" cy="128" r="122" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Inner Ambient Glow -->
  <circle cx="128" cy="128" r="80" fill="#E4521B" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- User / Next You Silhouette + Star/Spark -->
  <g transform="translate(128, 118)">
    <!-- Head / Spark -->
    <circle cx="0" cy="-30" r="24" fill="url(#primaryGrad)"/>
    
    <!-- Body curve -->
    <path d="M-42 36 C-42 10, -22 -2, 0 -2 C22 -2, 42 10, 42 36 Z" fill="url(#primaryGrad)" fill-opacity="0.9"/>
    
    <!-- Plus / Star Accent in Center -->
    <path d="M0 -38 L3 -30 L11 -30 L5 -25 L7 -17 L0 -22 L-7 -17 L-5 -25 L-11 -30 L-3 -30 Z" fill="#FFFFFF"/>
    
    <!-- Next Badge Ring -->
    <circle cx="28" cy="-28" r="12" fill="#E4521B" stroke="#1E1916" stroke-width="2.5"/>
    <path d="M28 -34 L28 -22 M22 -28 L34 -28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- "NEXT IS YOU" circular badge text ring or subtle banner -->
  <rect x="52" y="180" width="152" height="32" rx="16" fill="#E4521B" fill-opacity="0.2" stroke="#E4521B" stroke-width="1.5"/>
  <text x="128" y="201" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">NEXT IS YOU</text>
</svg>

